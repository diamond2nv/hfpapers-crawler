      category: neural-operator
      weight: 2
    - query: "physics-informed neural network"
      category: pinn
      weight: 1
    - query: "physical constraint residual loss PDE"
      category: pinn
      weight: 1
    - query: "AI 4 Science neural surrogate"
      category: foundation-model
      weight: 1
    - query: "neural operator physics informed"
      category: neural-operator
      weight: 2
    - query: "PDE solution operators"
      category: foundation-model
      weight: 1
    - query: "flow matching physical constraints"
      category: pinn
      weight: 1
    - query: "neural PDE solver"
      category: neural-operator
      weight: 2
    # v0.4.3: Expanded coverage — 12 new queries across all categories
    - query: "autoregressive neural operator"
      category: neural-operator
      weight: 1
    - query: "attention neural operator"
      category: neural-operator
      weight: 1
    - query: "graph neural operator"
      category: neural-operator
      weight: 1
    - query: "Fourier operator learning"
      category: neural-operator
      weight: 1
    - query: "geometric operator learning"
      category: neural-operator
      weight: 1
    - query: "multi-scale neural operator"
