anti_crawl:
  random_ua: true
  random_delay:
    base: 2.0
    jitter: 0.5
  max_retries: 3
  retry_delay_base: 30
  retry_http_codes:
  - 429
  - 503
  - 403
  - 408
  - 500
  - 502
  - 520
  proxy:
    enable: false
    providers: []
  cookies:
    enable: false
classification:
  keyword_score_high: 60
  phrase_score_high: 40
  threshold_pass: 30
  title_similarity_min: 0.4
  bert_enabled: true
hardware:
  max_pdf_size_mb: 50
  max_pdf_count: 500
  max_md_chars: 500000
  skip_if_no_gpu:
  - pymupdf4llm
  - sentence-transformers
  auto_downgrade: true
budget:
  max_tokens: 50000000
  max_cost_usd: 1.5
wiki:
  base_dir: ~/wiki
  concepts_dir: concepts
  entities_dir: entities
  index_file: index.md
  log_file: log.md
  batch_prefix: hfpapers-
  write_summary: true
graph:
  wiki_dir: ~/wiki
  cache_path: ~/.hermes/graph_cache.pkl
  default_limit: 200
  topic_from_title: true
  max_title_topics: 3
  skip_common_phrases:
  - study of
  - analysis of
  - on the
  - towards
  - investigation
  - enhanced
  - novel
  - new
  - review
  - survey
  geo:
    enabled: true
    cache_path: ~/.hermes/geo_cache.jsonl
    use_api: false
stepping:
  enabled: true
  api_delay: 3.5
  resume: true
  sources:
    s2_api: true
    pdf_refs: false
    tex_bib: false
    person_cards: true
  layers:
