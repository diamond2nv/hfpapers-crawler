# ─────────────────────────────────────────
# HF Papers Collector — Config-driven crawler system
# Main config: config.yaml
# Secrets:     .env
# ─────────────────────────────────────────

# ===== 1. Site Resources & Crawl Rules =====
search:
  # Built-in site config
  sources:
    huggingface:
      engine: "hf_cli"          # hf_cli | requests | browser
      command: "hf papers search '{query}' --json --limit {limit}"
      max_pages: 3
      delay_sec: 1.0
      enable: true
    arxiv:
      api_base: "https://export.arxiv.org/api/query"
      search_prefix: "https://export.arxiv.org/api/query?search_query="
      delay_sec: 3.0
      results_per_query: 50
      enable: false              # Fallback
    openreview:
      api_base: "https://api.openreview.net"
      max_results: 30
      enable: true               # Review records + papers
      notes: "Includes reviewer ratings and comments"
    pwc:
      api_base: "https://paperswithcode.com/api/v1"
      max_results: 30
      enable: true               # Code repos + SOTA rankings
      notes: "Includes official code repository links"

    # ─── CNS OA Journal Sources (Nature/Science/Cell Open Access) ───
    europepmc:
      enabled: false             # Enable for Nature Communications / Cell Reports searches
      journals:
        - "Nature Communications"
      page_size: 25
      notes: "Europe PMC REST API — public, no key required. Covers Nature Comms, Sci Reports, Cell Reports"
    semanticscholar:
      enabled: false             # Enable for Science Advances / OA journal searches
      journals:
        - "Science Advances"
      api_key: ""                # Optional: get from https://api.semanticscholar.org/
      notes: "Semantic Scholar API — journal-filtered, OA PDF filter. 100req/5min without key"

  # Enabled search sources (ordered by priority)
  enabled:
    - "hf_cli"
    - "pwc_api"
    - "openreview"
    - "arxiv_api"        # AI4Math: arXiv API for math/theorem-proving papers
    # - "arxiv_api"  # Fallback, disabled by default

  # Search dimensions
  max_per_dim: 30               # Max results per dimension (after multi-source dedup)
  queries:
    # ═══ PDE / Neural Operator (original) ═══
