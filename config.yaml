search:
  sources:
    huggingface:
      engine: hf_cli
      command: hf papers search '{query}' --json --limit {limit}
      max_pages: 3
      delay_sec: 1.0
      enable: true
    arxiv:
      api_base: https://export.arxiv.org/api/query
      search_prefix: https://export.arxiv.org/api/query?search_query=
      delay_sec: 3.0
      results_per_query: 50
      enable: false
    openreview:
      api_base: https://api.openreview.net
      max_results: 30
      enable: true
      notes: Includes reviewer ratings and comments
    pwc:
      api_base: https://paperswithcode.com/api/v1
      max_results: 30
      enable: true
      notes: Includes official code repository links
    europepmc:
      enabled: false
      journals:
      - Nature Communications
      page_size: 25
      notes: Europe PMC REST API — public, no key required. Covers Nature Comms, Sci
        Reports, Cell Reports
    semanticscholar:
      enabled: false
      journals:
      - Science Advances
      api_key: ''
      notes: Semantic Scholar API — journal-filtered, OA PDF filter. 100req/5min without
        key
  enabled:
  - hf_cli
  - pwc_api
  - openreview
  - arxiv_api
  max_per_dim: 30
