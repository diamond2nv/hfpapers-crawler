[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hfpclawer"
version = "0.17.0"
description = "Multi-source academic paper clawler for PDE/neural operator/physics-informed ML — OAI-PMH download + PDF download + SQLite paper_store + Cross-Ref + MCP server"
authors = [
    {name = "Li Shen"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "pdf", "clawler", "snowflake", "crossref",
    "scrapy", "arxiv", "neural-operator",
    "paper-store", "pde", "machine-learning",
    "oai-pmh", "citation-audit", "semantic-scholar",
    "openalex", "mcp-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "typer>=0.9",
    "psutil>=5.8",
    "pymupdf4llm>=1.28.0",
    "pyzotero>=1.13.2",
    "spacy>=3.8.0",
    "click>=8.4.2",
    "networkx>=3.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/diamond2nv/hfpapers-crawler"
Repository = "https://github.com/diamond2nv/hfpapers-crawler"
Documentation = "https://github.com/diamond2nv/hfpapers-crawler"
"Bug Tracker" = "https://github.com/diamond2nv/hfpapers-crawler/issues"
"Changelog" = "https://github.com/diamond2nv/hfpapers-crawler/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = [
    "litellm>=1.85.0",
]
quic = [
    "aioquic>=1.2.0",
]
nlp = [
    "spacy>=3.8.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
nlp-full = [
    "hfpclawer[nlp]",
    "wordcloud>=1.9",
    "matplotlib>=3.5",
]
graph = [
    "networkx>=3.0",
    "geopy>=2.4",
]
pdf = [
    "pymupdf4llm",
]
scrapy = [
    "scrapy>=2.10",
    "scrapy-redis",
]
dev = [
    "hfpclawer[scrapy]",
    "hfpclawer[llm]",
    "hfpclawer[pdf]",
    "ruff",
    "pyright",
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.3",
]
arxiv = [
    # NOTE: arxiv-metadata-service is NOT installable via PyPI (requires GitHub clone).
    # See docs/kaggle-metadata.md for manual setup instructions.
    # pip install from GitHub will NOT work when hfpclawer is installed via PyPI.
]
audit = [
    # hfpclawer.citation_audit_s2 / citation_audit_oa use pure stdlib (urllib).
    # No additional dependencies required.
]
rank = [
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "onnxruntime>=1.18",
]
rank-gpu = [
    "hfpclawer[rank]",
    "torch>=2.2",
]
[project.scripts]
hfpclawer = "hfpapers.cli:app"

[tool.setuptools.packages.find]
include = ["hfpapers*", "hfpclawer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (e.g. venv creation + pip install), deselected by default",
    "gate_b: Geometry/base functionality verification gates (B10-B11)",
    "gate_c: Topology/pipeline verification gates (C01-C02)",
    "gate_f: Magnitude/config verification gates (F01-F02)",
]

[tool.coverage.run]
source = ["hfpapers"]
omit = ["hfpapers/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def main().*:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["E501"]

# Legacy issues in non-core files (pre-existing, not our concern)
[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
"tests/test_audit.py" = ["F841"]
"tests/test_semantic_service.py" = ["E402"]

[dependency-groups]
dev = [
    "fastapi>=0.139.0",
    "geopy[graph]>=2.4.1",
    "pytest>=9.1.1",
    "sympy>=1.14.0",
]

[tool.pyright]
include = ["hfpapers"]
exclude = ["hfpapers/graph/**"]
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
reportUndefinedVariable = "error"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportIncompatibleMethodOverride = "error"
reportAssignmentType = "error"
reportGeneralTypeIssues = "warning"
reportCallIssue = "error"
