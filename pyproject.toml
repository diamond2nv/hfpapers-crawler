[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hfpclawer"
version = "0.19.0"
description = "Multi-source academic paper clawler for PDE/neural operator/physics-informed ML — OAI-PMH download + PDF download + SQLite paper_store + Cross-Ref + MCP server"
authors = [
    {name = "Li Shen"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "pdf", "clawler", "snowflake", "crossref",
    "scrapy", "arxiv", "neural-operator",
    "paper-store", "pde", "machine-learning",
    "oai-pmh", "citation-audit", "semantic-scholar",
    "openalex", "mcp-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "typer>=0.9",
    "psutil>=5.8",
    "pymupdf4llm>=1.28.0",
    "click>=8.4.2",
    "networkx>=3.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/diamond2nv/hfpapers-crawler"
Repository = "https://github.com/diamond2nv/hfpapers-crawler"
Documentation = "https://github.com/diamond2nv/hfpapers-crawler"
"Bug Tracker" = "https://github.com/diamond2nv/hfpapers-crawler/issues"
"Changelog" = "https://github.com/diamond2nv/hfpapers-crawler/blob/master/CHANGELOG.md"
"Release history" = "https://pypi.org/project/hfpclawer/#history"

[project.optional-dependencies]
llm = [
    "litellm>=1.85.0",
]
quic = [
    "aioquic>=1.2.0",
]
nlp = [
    # spaCy is imported lazily (hfpapers/nlp degrades to "feature disabled"), so it
    # lives here rather than in the core install: `pip install hfpclawer` should not
    # pull a ~70 MB NLP stack for users who never touch entity enrichment.
    "spacy>=3.8.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
zotero = [
    # pyzotero is imported behind a HAS_PYZOTERO guard (hfpclawer/zotero); the local API
    # is reached over HTTP, so the client library is only needed to talk to it.
    "pyzotero>=1.13.2",
]
nlp-full = [
    "hfpclawer[nlp]",
    "wordcloud>=1.9",
    "matplotlib>=3.5",
]
graph = [
    "networkx>=3.0",
    "geopy>=2.4",
]
pdf = [
    # Compatibility alias: pymupdf4llm is a core dependency (PDF→Markdown is on the main
    # path), so this extra adds nothing. Kept so `hfpclawer[pdf]` in older instructions
    # keeps resolving instead of erroring on an unknown extra.
    "pymupdf4llm",
]
scrapy = [
    "scrapy>=2.10",
    "scrapy-redis",
]
dev = [
    "hfpclawer[scrapy]",
    "hfpclawer[llm]",
    "hfpclawer[pdf]",
    "hfpclawer[nlp]",
    "hfpclawer[zotero]",
    "ruff",
    "pyright",
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.3",
    # sympy's LaTeX parser needs the antlr runtime at import time (parse_latex), and it
    # insists on exactly 4.11 — 4.13 raises an ImportError that reads like a missing
    # package. Without it tests/test_verify_* fail on every machine.
    "antlr4-python3-runtime==4.11.0",  # sympy 1.14 requires exactly the 4.11 runtime
]
arxiv = [
    # NOTE: arxiv-metadata-service is NOT installable via PyPI (requires GitHub clone).
    # See docs/kaggle-metadata.md for manual setup instructions.
    # pip install from GitHub will NOT work when hfpclawer is installed via PyPI.
]
audit = [
    # hfpclawer.citation_audit_s2 / citation_audit_oa use pure stdlib (urllib).
    # No additional dependencies required.
]
rank = [
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "onnxruntime>=1.18",
]
rank-gpu = [
    "hfpclawer[rank]",
    "torch>=2.2",
]
[project.scripts]
hfpclawer = "hfpapers.cli:app"

[tool.setuptools.packages.find]
include = ["hfpapers*", "hfpclawer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# The default run must be deterministic and finish: tests that spawn real servers or
# CLIs, need a live service, or build a wheel in a temp venv are opt-in. Passing -m on
# the command line overrides this expression (argparse keeps the last value).
addopts = "-q --tb=short -m 'not slow and not network and not integration'"
asyncio_mode = "auto"
markers = [
    "slow: builds a wheel/venv or otherwise takes minutes — opt in with -m slow",
    "network: hits a live external service (arXiv/OpenAlex/S2/Zotero/Wolfram) — opt in with -m network",
    "integration: spawns real servers/CLIs (MCP stdio, HTTP) and may not terminate in a bare environment — opt in with -m integration",
    "gate_b: Geometry/base functionality verification gates (B10-B11)",
    "gate_c: Topology/pipeline verification gates (C01-C02)",
    "gate_f: Magnitude/config verification gates (F01-F02) + state-location gates (F05-F06)",
]

[tool.coverage.run]
source = ["hfpapers"]
omit = ["hfpapers/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def main().*:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["E501"]

# Legacy issues in non-core files (pre-existing, not our concern)
[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
"tests/test_audit.py" = ["F841"]
"tests/test_semantic_service.py" = ["E402"]

# Two dev definitions exist for one reason: pip reads
# [project.optional-dependencies] (`pip install -e ".[dev]"`), uv reads PEP 735
# [dependency-groups] (`uv sync --group dev`). They must stay in step — the suite needs
# pytest-asyncio (asyncio_mode) and pytest-timeout (the network tests), and a missing
# plugin turns those declarations into silent no-ops.
[dependency-groups]
dev = [
    "hfpclawer[scrapy]",
    "hfpclawer[llm]",
    "hfpclawer[pdf]",
    "hfpclawer[graph]",
    "hfpclawer[nlp]",
    "hfpclawer[zotero]",
    "fastapi>=0.139.0",
    "sympy>=1.14.0",
    "ruff",
    "pyright",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.3",
    "antlr4-python3-runtime==4.11.0",  # sympy 1.14 requires exactly the 4.11 runtime
]

[tool.pyright]
include = ["hfpapers"]
exclude = ["hfpapers/graph/**"]
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
reportUndefinedVariable = "error"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportIncompatibleMethodOverride = "error"
reportAssignmentType = "error"
reportGeneralTypeIssues = "warning"
reportCallIssue = "error"
